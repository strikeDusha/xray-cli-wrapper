[package]
name = "v3xtun"
version = "0.1.0"
description = "v3xtun — GUI wrapper for tun2proxy + xray"
authors = ["strikeDusha"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "v3xtun_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "v3xtun"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
